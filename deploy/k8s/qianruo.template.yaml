apiVersion: v1
kind: Namespace
metadata:
  name: ${K8S_NAMESPACE}
---
apiVersion: v1
kind: Secret
metadata:
  name: qianruo-secret
  namespace: ${K8S_NAMESPACE}
type: Opaque
stringData:
  mysql-root-password: "${MYSQL_ROOT_PASSWORD}"
  platform-db-username: "${PLATFORM_DB_USERNAME}"
  platform-db-password: "${PLATFORM_DB_PASSWORD}"
  merchant-db-username: "${MERCHANT_DB_USERNAME}"
  merchant-db-password: "${MERCHANT_DB_PASSWORD}"
  nacos-auth-token: "${NACOS_AUTH_TOKEN}"
  nacos-auth-identity-key: "${NACOS_AUTH_IDENTITY_KEY}"
  nacos-auth-identity-value: "${NACOS_AUTH_IDENTITY_VALUE}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: qianruo-config
  namespace: ${K8S_NAMESPACE}
data:
  TZ: Asia/Shanghai
  SPRING_PROFILES_ACTIVE: dev
  NACOS_ADDR: ruoyi-nacos:8848
  MYSQL_HOST: ruoyi-mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ry-cloud
  REDIS_HOST: ruoyi-redis
  REDIS_PORT: "6379"
  JAVA_OPTS: "${JAVA_OPTS}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: ${K8S_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: ${K8S_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: file-data
  namespace: ${K8S_NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-mysql
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-mysql
  template:
    metadata:
      labels:
        app: ruoyi-mysql
    spec:
      containers:
        - name: mysql
          image: ${MYSQL_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: ry-cloud
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qianruo-secret
                  key: mysql-root-password
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: qianruo-config
                  key: TZ
          args:
            - --innodb-buffer-pool-size=256M
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --default-time-zone=+8:00
            - --lower-case-table-names=1
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-mysql
  namespace: ${K8S_NAMESPACE}
spec:
  selector:
    app: ruoyi-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: batch/v1
kind: Job
metadata:
  name: qianruo-db-access
  namespace: ${K8S_NAMESPACE}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: qianruo-db-access
    spec:
      restartPolicy: Never
      containers:
        - name: provision
          image: ${MYSQL_IMAGE}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/qianruo/provision-service-db-users.sh"]
          env:
            - name: MYSQL_HOST
              value: ruoyi-mysql
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qianruo-secret
                  key: mysql-root-password
            - name: PLATFORM_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qianruo-secret
                  key: platform-db-username
            - name: PLATFORM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qianruo-secret
                  key: platform-db-password
            - name: MERCHANT_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qianruo-secret
                  key: merchant-db-username
            - name: MERCHANT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qianruo-secret
                  key: merchant-db-password
          volumeMounts:
            - name: provision-script
              mountPath: /opt/qianruo
              readOnly: true
      volumes:
        - name: provision-script
          configMap:
            name: qianruo-db-access-script
            defaultMode: 0555
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-redis
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-redis
  template:
    metadata:
      labels:
        app: ruoyi-redis
    spec:
      containers:
        - name: redis
          image: ${REDIS_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          args:
            - redis-server
            - --appendonly
            - "yes"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-redis
  namespace: ${K8S_NAMESPACE}
spec:
  selector:
    app: ruoyi-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-nacos
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-nacos
  template:
    metadata:
      labels:
        app: ruoyi-nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v3.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8848
            - containerPort: 9848
            - containerPort: 9849
          env:
            - name: MODE
              value: standalone
            - name: NACOS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: qianruo-secret
                  key: nacos-auth-token
            - name: NACOS_AUTH_IDENTITY_KEY
              valueFrom:
                secretKeyRef:
                  name: qianruo-secret
                  key: nacos-auth-identity-key
            - name: NACOS_AUTH_IDENTITY_VALUE
              valueFrom:
                secretKeyRef:
                  name: qianruo-secret
                  key: nacos-auth-identity-value
            - name: SPRING_DATASOURCE_PLATFORM
              value: mysql
            - name: MYSQL_SERVICE_HOST
              value: ruoyi-mysql
            - name: MYSQL_SERVICE_PORT
              value: "3306"
            - name: MYSQL_SERVICE_DB_NAME
              value: ry-config
            - name: MYSQL_SERVICE_USER
              value: root
            - name: MYSQL_SERVICE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qianruo-secret
                  key: mysql-root-password
            - name: MYSQL_SERVICE_DB_PARAM
              value: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia%2FShanghai
---
apiVersion: v1
kind: Service
metadata:
  name: ruoyi-nacos
  namespace: ${K8S_NAMESPACE}
spec:
  selector:
    app: ruoyi-nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
    - name: client-rpc
      port: 9848
      targetPort: 9848
    - name: raft-rpc
      port: 9849
      targetPort: 9849
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruoyi-gateway
  namespace: ${K8S_NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruoyi-gateway
  template:
    metadata:
