        app: ruoyi-gateway
    spec:
      containers:
        - name: ruoyi-gateway
          image: ${REGISTRY}/${IMAGE_NAMESPACE}/ruoyi-gateway:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: qianruo-config
          env:
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              value: ruoyi-nacos:8848
            - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
              value: ruoyi-nacos:8848
            - name: SPRING_DATA_REDIS_HOST
              value: ruoyi-redis
---
apiVersion: v1
